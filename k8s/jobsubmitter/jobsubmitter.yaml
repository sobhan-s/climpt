apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobsubmitter
  namespace: climpt
  labels:
    app: jobsubmitter
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobsubmitter
  template:
    metadata:
      labels:
        app: jobsubmitter
        version: v1
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: '/metrics'
    spec:
      containers:
        - name: jobsubmitter
          image: jobsubmitter:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: MAIN_PORT
              value: '8000'
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: jobsubmitter
  namespace: climpt
  labels:
    app: jobsubmitter
spec:
  selector:
    app: jobsubmitter
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: LoadBalancer
