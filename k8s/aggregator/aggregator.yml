apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  namespace: climpt
  labels:
    app: aggregator
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
        version: v1
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8002'
        prometheus.io/path: '/metrics'
    spec:
      containers:
        - name: aggregator
          image: aggregator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '300m'
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aggregator
  namespace: climpt
  labels:
    app: aggregator
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '8002'
    prometheus.io/path: '/metrics'
spec:
  selector:
    app: aggregator
  ports:
    - name: http
      port: 8002
      targetPort: 8002
      protocol: TCP
  type: ClusterIP
